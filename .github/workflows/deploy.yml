name: Deploy

# GitOps 的职责划分：
#   这个 workflow  负责「构建镜像 + 把新版本写进 Git 里的部署清单」
#   Argo CD        负责「监测 Git 变化 + 把清单同步到集群」
#
# 所以这里既不需要 SSH 到服务器，也不需要 kubeconfig —— **CI 从头到尾接触不到集群**。
# 集群凭据不外泄，回滚 = git revert，有人手改集群也会被 Argo CD 纠正回来。
on:
  push:
    branches: [main]
    # 清单变更由 Argo CD 处理，不该再触发一次构建（否则会自我循环）
    paths-ignore:
      - 'k8s/**'
  workflow_dispatch:

jobs:
  build-and-release:
    name: 构建镜像并更新部署清单
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 需要写权限：把新 tag 提交回仓库
      packages: write   # 需要包权限：推 ghcr.io
    steps:
      - uses: actions/checkout@v4

      # GHCR 要求仓库路径全小写，而 GitHub 用户名可能含大写（本仓库是 YumeFusaka），
      # 直接用 github.repository_owner 会被 registry 拒绝："repository name must be lowercase"
      - name: 计算镜像地址与构建时间
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${OWNER}/envoymart-auth" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "镜像地址: ${IMAGE}"

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像 tag 用 commit SHA —— 可追溯与可回滚的前提。
      # 用 latest 的话，回滚时「回滚到哪个 latest？」是答不上来的。
      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          build-args: |
            SERVICE=auth-service
            BUILD_SHA=${{ github.sha }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      # GitOps 的落点：把「期望状态」写进 Git，剩下的事交给 Argo CD。
      # 提交信息里带 chore(deploy) 前缀便于回溯，也因为是 k8s/ 下的改动，
      # 被上面的 paths-ignore 排除，不会触发这个 workflow 再次运行。
      - name: 更新部署清单里的镜像 tag
        run: |
          sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${{ github.sha }}|" k8s/auth-service.yaml
          echo "--- 改动后的镜像行 ---"
          grep "image: ${IMAGE}" k8s/auth-service.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/auth-service.yaml

          if git diff --cached --quiet; then
            echo "清单无变化（tag 已经是这个 SHA），跳过提交"
          else
            git commit -m "chore(deploy): auth-service 镜像更新到 ${{ github.sha }}"
            git push
            echo "已提交。Argo CD 监测到变化后会自动同步到集群。"
          fi
