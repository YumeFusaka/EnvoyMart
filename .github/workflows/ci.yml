name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # 测试包含检索质量门禁（RetrievalQualityTest）：
      # Hit Rate / MRR / NDCG 跌破阈值即构建失败，防止改动悄悄把检索效果改坏。
      # 门槛是「回归防线」而非质量结论——这 30 条样本同时用于开发、调参与门禁，没有留出集。
      #
      # 不需要 JWT_SECRET：配置里刻意不设默认值（仓库里的默认密钥等于没有密钥），
      # 但校验发生在 Spring 上下文启动时，而这里是纯单元测试，不加载上下文。
      - name: 构建并运行测试
        run: mvn -B clean test

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查与构建
        run: pnpm run build
