# EnvoyMart 智能零售平台 - Docker 部署
# 基础设施：Nacos + MySQL + Redis + RabbitMQ + Elasticsearch + Sentinel + Milvus

networks:
  envoymart-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  es-data:
  nacos-data:
  rabbitmq-data:
  etcd-data:
  minio-data:
  milvus-data:

services:
  # ========== 注册中心 ==========
  nacos:
    image: nacos/nacos-server:v2.5.1
    # 本地开发：Docker Desktop 重启后自动拉起，避免整套中间件静默停摆
    restart: unless-stopped
    container_name: envoymart-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 512m
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - envoymart-net

  # ========== 数据库 ==========
  mysql:
    image: mysql:8.4
    # 本地开发：Docker Desktop 重启后自动拉起，避免整套中间件静默停摆
    restart: unless-stopped
    container_name: envoymart-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: envoymart123
      MYSQL_DATABASE: envoymart
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - envoymart-net

  # ========== 缓存 ==========
  redis:
    image: redis:7.4
    # 本地开发：Docker Desktop 重启后自动拉起，避免整套中间件静默停摆
    restart: unless-stopped
    container_name: envoymart-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    # 持久化用 AOF：订单与库存的缓存随时可重建，但用户画像与会话窗口丢了就是丢了。
    #
    # 淘汰策略选 noeviction 而不是 allkeys-lru：本项目只有一个 Redis 实例，
    # 缓存与分布式锁共用。allkeys-lru 在内存压力下会淘汰「最久未用」的 key——
    # 而一把被持有的锁恰恰可能很久没被访问，被淘汰就等于互斥静默失效，
    # 库存直接超卖。noeviction 在内存满时让写入报错，那是**可见的失败**，
    # 比"锁没了但没人知道"好得多。
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    networks:
      - envoymart-net

  # ========== 消息队列 ==========
  rabbitmq:
    image: rabbitmq:4.1-management
    # 本地开发：Docker Desktop 重启后自动拉起，避免整套中间件静默停摆
    restart: unless-stopped
    container_name: envoymart-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: envoymart
      RABBITMQ_DEFAULT_PASS: envoymart123
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - envoymart-net

  # ========== 搜索引擎 ==========
  elasticsearch:
    image: elasticsearch:9.4.5
    # 本地开发：Docker Desktop 重启后自动拉起，避免整套中间件静默停摆
    restart: unless-stopped
    container_name: envoymart-es
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - envoymart-net

  # ========== Sentinel 控制台 ==========
  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.8
    # 本地开发：Docker Desktop 重启后自动拉起，避免整套中间件静默停摆
    restart: unless-stopped
    container_name: envoymart-sentinel
    ports:
      - "8858:8858"   # 控制台 UI；该镜像实际监听 8858（另有 8719 供客户端上报）
    networks:
      - envoymart-net

  # ========== 向量库（Milvus standalone 依赖 etcd + minio） ==========
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    # 本地开发：Docker Desktop 重启后自动拉起，避免整套中间件静默停摆
    restart: unless-stopped
    container_name: envoymart-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd-data:/etcd
    networks:
      - envoymart-net

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    # 本地开发：Docker Desktop 重启后自动拉起，避免整套中间件静默停摆
    restart: unless-stopped
    container_name: envoymart-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio-data:/minio_data
    networks:
      - envoymart-net

  milvus:
    image: milvusdb/milvus:v2.6.0
    # 本地开发：Docker Desktop 重启后自动拉起，避免整套中间件静默停摆
    restart: unless-stopped
    container_name: envoymart-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    networks:
      - envoymart-net

  # ========== 链路追踪 ==========
  # 在此之前只有 ai-service 一条链路有 OTel 埋点，其余六个业务服务只有健康检查。
  # SkyWalking 用 javaagent 接入——不改一行业务代码就覆盖全部服务。
  #
  # 存储用 JDBC + 本机 MySQL，不新起存储容器。两条路都试过才落到这里：
  #   - H2：SkyWalking 10.x 已移除该存储（classpath 里只剩 es / banyandb / jdbc）
  #   - ES 9.4：OAP 10.2 报 "Unsupported version: ElasticSearch 9.4"，它跟不上 ES 的版本
  # 库要事先建好（OAP 会自动建表）：CREATE DATABASE skywalking。
  skywalking-oap:
    image: apache/skywalking-oap-server:10.2.0
    restart: unless-stopped
    container_name: envoymart-skywalking-oap
    environment:
      # selector 的值是 mysql 而不是 jdbc——配置段本身叫 mysql（见 application.yml 的
      # storage.mysql），写 jdbc 会报 "no provider found for module storage"
      SW_STORAGE: mysql
      # MySQL 装在宿主机而非容器里，用 host.docker.internal 回到宿主。
      # rewriteBatchedStatements 与 allowMultiQueries 是官方默认值里带的，批量写表需要
      SW_JDBC_URL: jdbc:mysql://host.docker.internal:3306/skywalking?rewriteBatchedStatements=true&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SW_DATA_SOURCE_USER: ${DB_USERNAME:-yumefusaka}
      SW_DATA_SOURCE_PASSWORD: ${DB_PASSWORD:-j}
    volumes:
      # OAP 镜像自带 PostgreSQL 驱动但没带 MySQL 的，挂进去补上。
      # 目录由 README 里的说明从本地 maven 仓库拷贝，不入库（见 .gitignore）
      - ./skywalking-libs:/skywalking/ext-libs:ro
    ports:
      - "11800:11800"   # agent 上报（gRPC）
      - "12800:12800"   # UI 查询（HTTP）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - envoymart-net

  skywalking-ui:
    image: apache/skywalking-ui:10.2.0
    restart: unless-stopped
    container_name: envoymart-skywalking-ui
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    ports:
      - "8088:8080"
    depends_on:
      - skywalking-oap
    networks:
      - envoymart-net
