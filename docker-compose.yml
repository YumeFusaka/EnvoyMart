# EnvoyMart 智能零售平台 - Docker 部署
# 基础设施：Nacos + MySQL + Redis + RabbitMQ + Elasticsearch + Sentinel + Milvus

networks:
  envoymart-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  es-data:
  nacos-data:
  rabbitmq-data:
  etcd-data:
  minio-data:
  milvus-data:

services:
  # ========== 注册中心 ==========
  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: envoymart-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 512m
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - envoymart-net

  # ========== 数据库 ==========
  mysql:
    image: mysql:8.4
    container_name: envoymart-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: envoymart123
      MYSQL_DATABASE: envoymart
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - envoymart-net

  # ========== 缓存 ==========
  redis:
    image: redis:7.4
    container_name: envoymart-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - envoymart-net

  # ========== 消息队列 ==========
  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: envoymart-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: envoymart
      RABBITMQ_DEFAULT_PASS: envoymart123
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - envoymart-net

  # ========== 搜索引擎 ==========
  elasticsearch:
    image: elasticsearch:9.4.5
    container_name: envoymart-es
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - envoymart-net

  # ========== Sentinel 控制台 ==========
  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.8
    container_name: envoymart-sentinel
    ports:
      - "8718:8718"
    networks:
      - envoymart-net

  # ========== 向量库（Milvus standalone 依赖 etcd + minio） ==========
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: envoymart-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd-data:/etcd
    networks:
      - envoymart-net

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: envoymart-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio-data:/minio_data
    networks:
      - envoymart-net

  milvus:
    image: milvusdb/milvus:v2.6.0
    container_name: envoymart-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    networks:
      - envoymart-net
