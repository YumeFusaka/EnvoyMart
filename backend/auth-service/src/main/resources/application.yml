server:
  port: 9001

spring:
  application:
    name: auth-service
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    url: ${DB_URL:jdbc:h2:mem:authdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  token-name: token
  ttl: ${JWT_TTL:604800000}
  secret-key: ${JWT_SECRET:}

# 构建信息可追溯：镜像构建时把 commit SHA 注入（见 Dockerfile 的 BUILD_SHA），
# 运行时通过 /actuator/info 就能查到当前跑的是哪个提交 —— 排查线上问题时，
# 「这个 Pod 到底是哪个版本」是第一个要确认的事。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: auth-service
    build-sha: ${BUILD_SHA:local-unknown}
    build-time: ${BUILD_TIME:unknown}
