server:
  port: 9005

spring:
  application:
    name: payment-service
  datasource:
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    url: ${DB_URL:jdbc:h2:mem:paymentdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:envoymart}
    password: ${RABBITMQ_PASSWORD:envoymart123}
    # 生产端确认见 common 的 RabbitPublisherConfirms。支付完成事件驱动订单转 PAID，
    # 这条消息静默丢失意味着"用户付了钱、订单状态不动"——比普通事件更不能容忍
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

services:
  order-service-url: ${ORDER_SERVICE_URL:http://127.0.0.1:9003}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

envoymart:
  payment:
    # 支付回调验签密钥（HMAC-SHA256）。未配置时拒绝所有回调——资金入口宁可拒绝也不能放宽。
    # 渠道侧约定：X-Pay-Signature = hex(HMAC-SHA256(secret, orderId|transactionNo|status))
    callback-secret: ${PAYMENT_CALLBACK_SECRET:}
    # 模拟支付开关。它扮演"渠道"把回调发回来，走的是与真实渠道完全相同的处理路径。
    # **默认关闭**：这条路径能把订单标记为已支付，不该在任何环境里默认可用，
    # 本地演示时由 run-local.sh 显式打开。
    mock-enabled: ${PAYMENT_MOCK_ENABLED:false}
