server:
  port: 9004

spring:
  application:
    name: ai-service
  # 默认不加载 Milvus 自动配置：本地无 Milvus 时走内存向量库降级。
  # 启用方式：SPRING_PROFILES_ACTIVE=milvus
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.milvus.autoconfigure.MilvusVectorStoreAutoConfiguration
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  ai:
    mcp:
      server:
        name: envoymart-mcp
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
        instructions: EnvoyMart 电商业务工具（订单查询、物流追踪、商品搜索），供外部 Agent 调用。
        streamable-http:
          mcp-endpoint: /mcp
    openai:
      # 留空则回退到 MockLLMProvider，服务仍可启动、链路仍可跑通
      api-key: ${LLM_API_KEY:}
      # 默认指向阿里云百炼（DashScope）OpenAI 兼容端点；可换 DeepSeek / Ollama 等
      base-url: ${LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      chat:
        model: ${LLM_MODEL:qwen-plus}
        temperature: 0.7
      embedding:
        model: ${LLM_EMBEDDING_MODEL:text-embedding-v4}

services:
  product-service-url: ${PRODUCT_SERVICE_URL:http://127.0.0.1:9002}
  order-service-url: ${ORDER_SERVICE_URL:http://127.0.0.1:9003}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
    export:
      # 配了 OTLP 端点才导出；可指向 Langfuse(/api/public/otel) 或 Jaeger/Tempo
      enabled: ${TRACING_EXPORT_ENABLED:false}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://127.0.0.1:4318/v1/traces}

---
# 生产/联调：接入 Milvus 作为向量库（需先启动 docker compose 里的 milvus）
spring:
  config:
    activate:
      on-profile: milvus
  autoconfigure:
    exclude: []
  ai:
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:127.0.0.1}
          port: ${MILVUS_PORT:19530}
        collection-name: envoymart_knowledge
        initialize-schema: true
