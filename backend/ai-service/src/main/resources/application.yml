server:
  port: 9004

spring:
  application:
    name: ai-service
  # 关闭本项目用不到的自动配置：
  # - Milvus：本地无 Milvus 时走内存向量库降级，启用方式 SPRING_PROFILES_ACTIVE=milvus
  # - OpenAI 的音频/图像/审核：它们各自要求凭证，而对话与向量化的 Key 已拆分配置，
  #   留着会让容器启动失败
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.milvus.autoconfigure.MilvusVectorStoreAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  cloud:
    # 外部调用必须有超时：默认 readTimeout 是 60 秒，下游一卡就把调用方线程占满
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  ai:
    mcp:
      server:
        name: envoymart-mcp
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
        instructions: EnvoyMart 电商业务工具（订单查询、物流追踪、商品搜索），供外部 Agent 调用。
        streamable-http:
          mcp-endpoint: /mcp
    # 对话与向量化分开配置：两者可以来自不同供应商。
    # DeepSeek 只有 Chat Completions、没有 Embeddings 端点，所以向量化仍留在百炼。
    openai:
      chat:
        # 留空则回退到 MockLLMProvider，服务仍可启动、链路仍可跑通
        api-key: ${LLM_API_KEY:}
        base-url: ${LLM_BASE_URL:https://api.deepseek.com}
        model: ${LLM_MODEL:deepseek-flash}
        temperature: 0.7
        # DeepSeek 默认开启思考模式，会返回 reasoning_content 并占用输出 token。
        # Agent 的调用多为分类/规划/合成，不需要深度推理，关掉以降低延迟与成本。
        extra-body:
          thinking:
            type: ${LLM_THINKING:disabled}
      embedding:
        api-key: ${EMBEDDING_API_KEY:}
        base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        model: ${LLM_EMBEDDING_MODEL:text-embedding-v4}

services:
  product-service-url: ${PRODUCT_SERVICE_URL:http://127.0.0.1:9002}
  order-service-url: ${ORDER_SERVICE_URL:http://127.0.0.1:9003}

jwt:
  token-name: token
  ttl: ${JWT_TTL:604800000}
  secret-key: ${JWT_SECRET:}

envoymart:
  mcp:
    # 机器客户端可用 X-MCP-API-Key 访问 /mcp；留空则只接受平台 JWT
    api-key: ${MCP_API_KEY:}
  rerank:
    # 重排与向量化同属百炼（DeepSeek 无 rerank 端点），默认复用 embedding 的 Key
    api-key: ${RERANK_API_KEY:${EMBEDDING_API_KEY:}}
    model: ${RERANK_MODEL:gte-rerank-v2}
    timeout-ms: ${RERANK_TIMEOUT_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # DEGRADED 必须排进聚合顺序，否则会被其他 UP 淹没、健康端点看不出降级。
      # 它排在 OUT_OF_SERVICE 之后，所以只体现状态、不会把实例摘出负载均衡。
      status:
        order: DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
    export:
      # 配了 OTLP 端点才导出；可指向 Langfuse(/api/public/otel) 或 Jaeger/Tempo
      enabled: ${TRACING_EXPORT_ENABLED:false}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://127.0.0.1:4318/v1/traces}

---
# 生产/联调：接入 Milvus 作为向量库（需先启动 docker compose 里的 milvus）
spring:
  config:
    activate:
      on-profile: milvus
  autoconfigure:
    # 只保留必须继续排除的几项。
    # 注意 YAML 列表是「覆盖」不是「合并」：这里写 exclude: [] 会把基础文档里的排除项
    # 全部清空，连 OpenAI 音频/图像/审核那几项也一起放回来，容器直接起不来。
    # 而 Milvus 的自动配置恰恰要在本 profile 下启用，所以它不在下面这份清单里。
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  ai:
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:127.0.0.1}
          port: ${MILVUS_PORT:19530}
        collection-name: envoymart_knowledge
        # 必须与 Embedding 模型输出维度一致，否则插入报 dimension mismatch
        embedding-dimension: ${MILVUS_EMBEDDING_DIMENSION:1024}
        initialize-schema: true
