server:
  port: 9004

spring:
  application:
    name: ai-service
  # 用户画像的持久化（见 RedisProfileRepository）。Redis 不可用时画像读写会失败，
  # 但 UserProfileStore 会兜住并降级为纯内存，对话本身不受影响。
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  cloud:
    # 外部调用必须有超时：默认 readTimeout 是 60 秒，下游一卡就把调用方线程占满
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
          # knowledge-service 单独放宽：它的调用全是**批处理**，不是有人在页面上等的读。
          #
          # 5 秒那档是按「用户等一个页面」定的。图谱写入是几百条边的事务，而且实测首次写入
          # 要 5.2 秒（Cypher 首次编译 + 连接预热），同一批里后续文档只要 0.1 秒——
          # 冷启动正好压在 5 秒线上，于是失败与否取决于机器快慢。
          #
          # 代价不对称：超时发生在客户端，服务端**照样会把边写完**，而调用方据此把这篇文档
          # 记成「失败」。也就是说这个超时不会保护任何东西，只会制造一条不存在的故障记录。
          knowledge-service:
            connect-timeout: 2000
            read-timeout: 30000
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}

services:
  product-service-url: ${PRODUCT_SERVICE_URL:http://127.0.0.1:9002}
  order-service-url: ${ORDER_SERVICE_URL:http://127.0.0.1:9003}
  knowledge-service-url: ${KNOWLEDGE_SERVICE_URL:http://127.0.0.1:9008}
  auth-service-url: ${AUTH_SERVICE_URL:http://127.0.0.1:9001}

jwt:
  token-name: token
  ttl: ${JWT_TTL:604800000}
  secret-key: ${JWT_SECRET:}

envoymart:
  agent:
    # 【高级项】审批令牌的签名密钥。用户点确认时带回的令牌由它签发与验签，
    # 载荷里写着这次要执行哪几次工具调用，客户端改不了。
    # 留空则每次启动生成一把进程内随机密钥并打 WARN：单机开发照常可用，
    # 但多实例部署必须显式配置同一个值，否则 A 实例签发的令牌在 B 实例上验不过。
    approval-secret: ${AGENT_APPROVAL_SECRET:}
  # 对话与向量化分开配置：两者可以来自不同供应商。
  # DeepSeek 只有 Chat Completions、没有 Embeddings 端点，所以向量化仍留在百炼。
  llm:
    # 留空则回退到 MockLLMProvider，服务仍可启动、链路仍可跑通
    api-key: ${LLM_API_KEY:}
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    model: ${LLM_MODEL:deepseek-flash}
    temperature: 0.7
    max-tokens: 2048
    timeout-ms: ${LLM_TIMEOUT_MS:60000}
    # DeepSeek 默认开启思考模式，会返回 reasoning_content 并占用输出 token。
    # Agent 的调用多为分类/规划/合成，不需要深度推理，关掉以降低延迟与成本。
    # 留空表示不发送该参数。
    thinking: ${LLM_THINKING:disabled}
    # 【高级项】模型单价：[输入单价, 输出单价]，单位元 / 千 token，用来把用量折成金额展示。
    # 它算的是**估价不是账单**——真实计费还有阶梯价、缓存命中折扣、批处理折扣等差异。
    # 没配到的模型只显示 token、不显示金额：拿邻近型号的价格顶替会得出一个
    # 看着精确的错误数字，而少一个数字是可接受的。
    pricing:
      deepseek-chat: [ 0.002, 0.008 ]
      deepseek-flash: [ 0.001, 0.002 ]
      qwen-plus: [ 0.0008, 0.002 ]
      qwen-max: [ 0.0024, 0.0096 ]
      qwen-turbo: [ 0.0003, 0.0006 ]
      text-embedding-v4: [ 0.0005, 0 ]
      gte-rerank-v2: [ 0.0008, 0 ]
  embedding:
    api-key: ${EMBEDDING_API_KEY:}
    base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${LLM_EMBEDDING_MODEL:text-embedding-v4}
    # 必须与向量库 collection 的维度一致，否则插入报 dimension mismatch
    dimension: ${MILVUS_EMBEDDING_DIMENSION:1024}
    timeout-ms: ${EMBEDDING_TIMEOUT_MS:30000}
  # 生产/联调：启用方式 SPRING_PROFILES_ACTIVE=milvus（run-local.sh 已默认带上）。
  # 不启用时走内存向量库降级，本地无 Milvus 也能启动。
  milvus:
    host: ${MILVUS_HOST:127.0.0.1}
    port: ${MILVUS_PORT:19530}
  mcp:
    # 机器客户端可用 X-MCP-API-Key 访问 /mcp；留空则只接受平台 JWT
    api-key: ${MCP_API_KEY:}
    endpoint: ${MCP_ENDPOINT:/mcp}
    server-name: envoymart-mcp
    server-version: 1.0.0
    instructions: >-
      EnvoyMart 电商业务工具，供外部 Agent 调用。查询类：商品搜索与多条件筛选（product_search）、
      订单查询（order_query）、物流追踪（logistics_query）、药物-营养素相互作用检查
      （interaction_check）、知识库检索（knowledge_search）。
      写操作类（**均需用户确认，调用时必须带 approvalToken**）：加购（cart_add）、
      下单（cart_checkout）、售后申请（after_sale_apply）、取消订单（order_cancel）。
  rerank:
    # 重排与向量化同属百炼（DeepSeek 无 rerank 端点），默认复用 embedding 的 Key
    api-key: ${RERANK_API_KEY:${EMBEDDING_API_KEY:}}
    model: ${RERANK_MODEL:gte-rerank-v2}
    timeout-ms: ${RERANK_TIMEOUT_MS:5000}
  rag:
    # 【公开项】图谱召回（混合检索的第三路）。
    # 开着时，问题里出现图上收录的实体（SPU 编号、成分名、药名）就会把图谱依据
    # 并入候选池；关掉则退回 BM25 + 向量的两路检索，行为与历史完全一致。
    # 留这个开关是为了能当场演示「同一句话，开与关各答一次」，
    # 而不是为了兜某个环境——图谱连不上时这一路本来就会自己降级成空。
    graph-recall:
      enabled: ${RAG_GRAPH_RECALL:true}
    # 【公开项】查询扩写（检索前的 HyDE + 多角度改写）。
    # 开着时，每次检索前多一次模型调用，把原句扩成「一段假想的资料原文」与
    # 「两条换个说法的查询」，分别喂给语义路与词法路；关掉则检索按原句进行，
    # 行为与历史完全一致。留这个开关是为了能当场演示「同一句话，开与关各检一次」。
    # 模型不可用时（无 Key 的 Mock 路径）自动短路，不产生调用也不产生延迟。
    query-expansion:
      enabled: ${RAG_QUERY_EXPANSION:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # DEGRADED 必须排进聚合顺序，否则会被其他 UP 淹没、健康端点看不出降级。
      # 它排在 OUT_OF_SERVICE 之后，所以只体现状态、不会把实例摘出负载均衡。
      status:
        order: DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
    export:
      # 配了 OTLP 端点才导出；可指向 Langfuse(/api/public/otel) 或 Jaeger/Tempo
      enabled: ${TRACING_EXPORT_ENABLED:false}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://127.0.0.1:4318/v1/traces}

# 每行日志前缀里带上请求标识（MDC 键 requestId，写入见 common 的 RequestIdFilter）。
# 没有请求上下文的行（启动期、定时任务）该位置为空。
logging:
  pattern:
    correlation: "[%X{requestId:-}] "
