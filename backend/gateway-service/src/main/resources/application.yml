server:
  port: 8080

spring:
  application:
    name: gateway-service
  # 未显式指定 profile 时默认走 standalone：用静态实例列表代替注册中心，开箱即可路由
  profiles:
    default: standalone
  # 认证态：auth-service 在禁用 / 改角色时写这里，网关每次鉴权读一次。
  # 放在默认文档里而不是某个 profile 下——所有 profile 都要用它，漏配的表现是
  # 「禁用用户后他的旧 Token 还能用」，而这种缺失不会报错
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # 默认 60 秒——Redis 挂掉时每个请求都要等满 60 秒才走到「按无记录放行」的降级分支，
      # 降级就变成了「慢 60 秒再降级」。压到 1 秒，故障时立刻退回只有 JWT 的旧行为
      timeout: 1s
      connect-timeout: 1s
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/products/**
            # 类目树与品牌：导航用的基础数据，和 /products 一样是公开读的。
            # 原先这两个前缀没有任何路由——前端每次进商城都在这里拿 404，
            # 分类导航与品牌筛选长期是空的。它不报错、不影响下单，只在网络面板里一闪而过，
            # 所以活了很久没人发现。现在由 RouteCoverageTest 兜住：控制器写了却没配路由会直接构建失败
            - id: product-service-catalog
              uri: lb://product-service
              predicates:
                - Path=/categories/**,/brands/**
            - id: order-service-cart
              uri: lb://order-service
              predicates:
                - Path=/cart/**
            - id: order-service-orders
              uri: lb://order-service
              predicates:
                - Path=/orders/**
            - id: order-service-after-sales
              uri: lb://order-service
              predicates:
                - Path=/after-sales/**
            - id: order-service-tickets
              uri: lb://order-service
              predicates:
                - Path=/tickets/**
            - id: promotion-service
              uri: lb://promotion-service
              predicates:
                - Path=/coupons/**
            - id: ai-service
              uri: lb://ai-service
              predicates:
                - Path=/ai/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/payments/**
            - id: review-service
              uri: lb://review-service
              predicates:
                - Path=/reviews/**
            - id: knowledge-service
              uri: lb://knowledge-service
              predicates:
                - Path=/knowledge/**
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      # 这里原先配了 scg.fallback.response-body。已移除：它在当前版本组合下从来没生效过
      # （超限请求拿到的是 HTTP 200 + 空 body，而不是这里的 429），留着只会让人以为改它有作用。
      # 限流响应的唯一出口是 GatewayErrorHandler。

jwt:
  token-name: token
  ttl: ${JWT_TTL:604800000}
  secret-key: ${JWT_SECRET:}

---
# 无注册中心时的静态实例兜底：lb:// 直接解析到本机端口，保证本地开箱即可路由。
#
# 放在独立的 standalone profile 下，而不是放在默认配置段里：
# 静态实例与真实注册中心各自注册一个 DiscoveryClient，Spring Cloud 的
# CompositeDiscoveryClient 按 order 排序取第一个——而**两者的 order 相同**
# （都是 LOWEST_PRECEDENCE），同时存在时谁生效是不确定的。实测静态列表会赢，
# 结果是「Nacos 配了、服务也注册了，但网关从来不查它」。
#
# gateway 的 spring.profiles.default 是 standalone，所以不显式指定 profile 时本段生效；
# 一旦显式激活了别的 profile（如 SPRING_PROFILES_ACTIVE=nacos 或 milvus），本段自动让位。
spring:
  config:
    activate:
      on-profile: standalone
  cloud:
    discovery:
      client:
        simple:
          instances:
            auth-service:
              - uri: ${AUTH_SERVICE_URL:http://127.0.0.1:9001}
            product-service:
              - uri: ${PRODUCT_SERVICE_URL:http://127.0.0.1:9002}
            order-service:
              - uri: ${ORDER_SERVICE_URL:http://127.0.0.1:9003}
            ai-service:
              - uri: ${AI_SERVICE_URL:http://127.0.0.1:9004}
            payment-service:
              - uri: ${PAYMENT_SERVICE_URL:http://127.0.0.1:9005}
            review-service:
              - uri: ${REVIEW_SERVICE_URL:http://127.0.0.1:9006}

# 每行日志前缀里带上请求标识（MDC 键 requestId，写入见 common 的 RequestIdFilter）。
# 没有请求上下文的行（启动期、定时任务）该位置为空。
logging:
  pattern:
    correlation: "[%X{requestId:-}] "
