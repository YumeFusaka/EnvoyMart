server:
  port: 8080

spring:
  application:
    name: gateway-service
  # 未显式指定 profile 时默认走 standalone：用静态实例列表代替注册中心，开箱即可路由
  profiles:
    default: standalone
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/products/**
            - id: order-service-cart
              uri: lb://order-service
              predicates:
                - Path=/cart/**
            - id: order-service-orders
              uri: lb://order-service
              predicates:
                - Path=/orders/**
            - id: ai-service
              uri: lb://ai-service
              predicates:
                - Path=/ai/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/payments/**
            - id: review-service
              uri: lb://review-service
              predicates:
                - Path=/reviews/**
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      scg:
        fallback:
          mode: response
          response-body: '{"code": 429, "message": "请求过于频繁，请稍后再试"}'

jwt:
  token-name: token
  ttl: ${JWT_TTL:604800000}
  secret-key: ${JWT_SECRET:}

---
# 无注册中心时的静态实例兜底：lb:// 直接解析到本机端口，保证本地开箱即可路由。
#
# 放在独立的 standalone profile 下，而不是放在默认配置段里：
# 静态实例与真实注册中心各自注册一个 DiscoveryClient，Spring Cloud 的
# CompositeDiscoveryClient 按 order 排序取第一个——而**两者的 order 相同**
# （都是 LOWEST_PRECEDENCE），同时存在时谁生效是不确定的。实测静态列表会赢，
# 结果是「Nacos 配了、服务也注册了，但网关从来不查它」。
#
# gateway 的 spring.profiles.default 是 standalone，所以不显式指定 profile 时本段生效；
# 一旦显式激活了别的 profile（如 SPRING_PROFILES_ACTIVE=nacos 或 milvus），本段自动让位。
spring:
  config:
    activate:
      on-profile: standalone
  cloud:
    discovery:
      client:
        simple:
          instances:
            auth-service:
              - uri: ${AUTH_SERVICE_URL:http://127.0.0.1:9001}
            product-service:
              - uri: ${PRODUCT_SERVICE_URL:http://127.0.0.1:9002}
            order-service:
              - uri: ${ORDER_SERVICE_URL:http://127.0.0.1:9003}
            ai-service:
              - uri: ${AI_SERVICE_URL:http://127.0.0.1:9004}
            payment-service:
              - uri: ${PAYMENT_SERVICE_URL:http://127.0.0.1:9005}
            review-service:
              - uri: ${REVIEW_SERVICE_URL:http://127.0.0.1:9006}
