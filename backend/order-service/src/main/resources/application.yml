server:
  port: 9003

spring:
  application:
    name: order-service
  datasource:
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    url: ${DB_URL:jdbc:h2:mem:orderdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
  cloud:
    # 外部调用必须有超时：默认 readTimeout 是 60 秒，下游一卡就把调用方线程占满
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
    # 熔断规则见 SentinelDegradeConfig（代码里加载，不依赖控制台常驻）
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      # 启动即初始化，而不是等第一次调用来触发
      eager: true
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:envoymart}
    password: ${RABBITMQ_PASSWORD:envoymart123}
    # 生产端确认：消息到达 broker 后回调，未到达则记录。没有它，发送方把消息
    # 交给客户端就认为成功，而消息可能根本没到 broker——静默丢失。
    publisher-confirm-type: correlated
    # 消息到了 broker 但路由不到任何队列时回调。交换机存在、路由键写错时，
    # 没有它同样是静默丢弃。
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        # 消费失败不重回队列，而是 nack → 进死信交换机。
        # 不开这个开关时，抛异常的消息会被无限 requeue，死信队列永远收不到东西。
        default-requeue-rejected: false
        retry:
          enabled: true
          # 共 3 次尝试（首次 + 2 次重试）；仍失败才判定为死信，避免一次抖动就打进人工队列
          max-retries: 2
          initial-interval: 1s

services:
  product-service-url: ${PRODUCT_SERVICE_URL:http://127.0.0.1:9002}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
