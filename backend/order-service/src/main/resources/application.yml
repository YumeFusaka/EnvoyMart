server:
  port: 9003

spring:
  application:
    name: order-service
  datasource:
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    url: ${DB_URL:jdbc:h2:mem:orderdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
  cloud:
    # 外部调用必须有超时：默认 readTimeout 是 60 秒，下游一卡就把调用方线程占满
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:envoymart}
    password: ${RABBITMQ_PASSWORD:envoymart123}
    listener:
      simple:
        acknowledge-mode: auto
        # 消费失败不重回队列，而是 nack → 进死信交换机。
        # 不开这个开关时，抛异常的消息会被无限 requeue，死信队列永远收不到东西。
        default-requeue-rejected: false
        retry:
          enabled: true
          # 共 3 次尝试（首次 + 2 次重试）；仍失败才判定为死信，避免一次抖动就打进人工队列
          max-retries: 2
          initial-interval: 1s

services:
  product-service-url: ${PRODUCT_SERVICE_URL:http://127.0.0.1:9002}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
