server:
  port: 9002

# 指标端点。缓存命中率、穿透拦截量、库存扣减这些都在本服务，
# 不暴露就只能靠"感觉变快了"判断防护有没有生效——而那种判断不可验证。
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

spring:
  application:
    name: product-service
  # 上传图片的大小上限。
  # Spring Boot 默认 multipart 单文件 1MB —— 小于业务规则里的 5MB，
  # 于是运营传一张 3MB 的图会在**进入控制器之前**被容器拒掉，报的还是框架层的
  # MaxUploadSizeExceededException，与「5MB」这条业务口径对不上。
  # 这里把它抬到业务上限之上留一点余量，真正的类型与大小校验仍由 MediaStorageService 做
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  # 缓存读停顿时长。
  #
  # **默认值是 60 秒**，这是个坑：Redis 挂掉时每个请求都要等满 60 秒才抛异常，
  # 于是"捕获异常后降级查库"根本救不了接口——实测就是这样，商品详情直接超时无响应。
  # **捕获一个 60 秒后才抛的异常，不是降级，是把"快速失败"改成了"慢速失败"。**
  #
  # 缓存是加速层，拿不到就该立刻放弃、直接回源（一次主键查询 5ms 就够）。
  # 1 秒的阈值：比它更慢的缓存本身就不产生价值，让位给数据库更快。
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 1s
      connect-timeout: 1s
  datasource:
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    url: ${DB_URL:jdbc:h2:mem:productdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://127.0.0.1:9200}
  # 只用于消费缓存失效的补偿消息，不发消息（生产者确认见 order/payment 两个服务）
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:envoymart}
    password: ${RABBITMQ_PASSWORD:envoymart123}
    listener:
      simple:
        acknowledge-mode: auto
        # 重试耗尽仍删不掉的消息进死信队列等人看，而不是无限 requeue 或静默丢弃
        default-requeue-rejected: false
        retry:
          enabled: true

# 分布式事务的参与方：扣库存要能被全局事务回滚
seata:
  enabled: ${SEATA_ENABLED:true}
  application-id: ${spring.application.name}
  tx-service-group: envoymart_tx_group
  service:
    vgroup-mapping:
      envoymart_tx_group: default
    grouplist:
      default: ${SEATA_SERVER:127.0.0.1:8091}
  registry:
    type: file
  config:
    type: file

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# 每行日志前缀里带上请求标识（MDC 键 requestId，写入见 common 的 RequestIdFilter）。
# 没有请求上下文的行（启动期、定时任务）该位置为空。
logging:
  pattern:
    correlation: "[%X{requestId:-}] "
