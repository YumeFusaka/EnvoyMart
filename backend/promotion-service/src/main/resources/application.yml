server:
  port: 9007

spring:
  # 共享的 Nacos 注册容错（见 common/src/main/resources/envoymart-nacos.yml）。
  # 放在这里而不是复制进每个服务：九份副本迟早分叉，而它防的是一个只在
  # 「九个服务同时冷启动」时才出现的竞态——分叉了也没人能在单服务启动时发现。
  config:
    import: classpath:envoymart-nacos.yml
  application:
    name: promotion-service
  datasource:
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    url: ${DB_URL:jdbc:h2:mem:promotiondb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
      # 已存在的库不会被 create table if not exists 改表结构，所以 MySQL 下额外跑一份
      # schema-mysql.sql 做幂等加列/加索引（H2 下不执行，单测表由 schema.sql 全新建）。
      platform: ${DB_SQL_PLATFORM:}
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 每行日志前缀里带上请求标识（MDC 键 requestId，写入见 common 的 RequestIdFilter）。
# 没有请求上下文的行（启动期、定时任务）该位置为空。
logging:
  pattern:
    correlation: "[%X{requestId:-}] "
