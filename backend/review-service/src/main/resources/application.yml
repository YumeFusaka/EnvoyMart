server:
  port: 9006

spring:
  application:
    name: review-service
  datasource:
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    url: ${DB_URL:jdbc:h2:mem:reviewdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
  # 同 (商品, IP) 的短窗口评价计数（刷评治理①）。Redis 不可用时该计数 fail-open，
  # 评价本身照常写入 —— 见 ReviewFloodGuard
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 1s
      connect-timeout: 1s
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:envoymart}
    password: ${RABBITMQ_PASSWORD:envoymart123}
    template:
      # 路由不到队列时把消息退回来（而不是静默丢弃）。
      # 评价聚合事件发往 envoymart.review，卖出去的队列由 product-service 声明 ——
      # 它没起、或队列名被改错时，没有这个开关就只在 broker 侧丢一条消息，
      # 发送方这边一切正常，商品评分停在旧值也无人知道
      mandatory: true

services:
  order-service-url: ${ORDER_SERVICE_URL:http://127.0.0.1:9003}
  product-service-url: ${PRODUCT_SERVICE_URL:http://127.0.0.1:9002}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# 每行日志前缀里带上请求标识（MDC 键 requestId，写入见 common 的 RequestIdFilter）。
# 没有请求上下文的行（启动期、定时任务）该位置为空。
logging:
  pattern:
    correlation: "[%X{requestId:-}] "
